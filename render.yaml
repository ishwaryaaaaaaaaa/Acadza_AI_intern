services:
  - type: web
    name: acadza-check
    runtime: python
    plan: starter            # always on; free tier sleeps and loses data
    buildCommand: pip install -r requirements.txt && cd console && npm install && npm run build
    startCommand: python -m uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # primary model for the "Ask AI" chat; set in the Render dashboard
      - key: COHERE_API_KEY
        sync: false          # secondary (fallback) model for the chat
      - key: GROQ_API_KEY
        sync: false          # optional third fallback (free tier)
      - key: ADMIN_KEY
        sync: false          # secret that unlocks "Reset demo data"; keep it to yourself
      - key: CONSOLE_STATE
        value: /data/state.json
      - key: CONSOLE_SETTINGS
        value: /data/settings.json
      - key: NODE_VERSION
        value: "22"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
