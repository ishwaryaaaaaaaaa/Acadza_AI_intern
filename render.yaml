services:
  - type: web
    name: acadza-check
    runtime: python
    plan: starter            # always on; free tier sleeps and loses data
    buildCommand: pip install -r requirements.txt && cd console && npm install && npm run build
    startCommand: python -m uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COHERE_API_KEY
        sync: false          # set in the Render dashboard; only the "Ask AI" chat needs it
      - key: CONSOLE_STATE
        value: /data/state.json
      - key: CONSOLE_SETTINGS
        value: /data/settings.json
      - key: NODE_VERSION
        value: "22"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
